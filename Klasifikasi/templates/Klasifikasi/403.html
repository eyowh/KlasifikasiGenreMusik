{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akses Ditolak — Dungeon Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f9f9ff; }
    .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#f9f9ff] text-[#111c2d]">
  <div class="text-center max-w-md mx-auto p-8">
    <div class="text-[#ba1a1a] mb-6">
      <span class="material-symbols-outlined" style="font-size: 96px; font-variation-settings: 'FILL' 1; color: #ba1a1a;">block</span>
    </div>
    <h1 class="font-['Plus_Jakarta_Sans'] font-extrabold text-[48px] leading-none tracking-tight text-[#3525cd] mb-4">403</h1>
    <h2 class="font-['Plus_Jakarta_Sans'] font-bold text-2xl text-[#111c2d] mb-4">Akses Ditolak</h2>
    <p class="text-[#464555] text-base mb-8 leading-relaxed">
      Anda tidak memiliki izin untuk mengakses halaman ini. Silakan hubungi administrator atau kembali ke dashboard.
    </p>
    <div class="flex gap-4 justify-center">
      <a href="javascript:history.back()"
         class="flex items-center gap-2 px-6 py-3 border border-[#c7c4d8] text-[#464555] rounded-lg font-semibold text-sm hover:bg-[#f0f3ff] transition-colors">
        <span class="material-symbols-outlined" style="font-size:18px;">arrow_back</span>
        Kembali
      </a>
      <a href="{% url 'Klasifikasi:home' %}"
         class="flex items-center gap-2 px-6 py-3 bg-[#3525cd] text-white rounded-lg font-semibold text-sm hover:bg-[#2b1ea8] transition-colors">
        <span class="material-symbols-outlined" style="font-size:18px;">dashboard</span>
        Dashboard
      </a>
    </div>
  </div>
</body>
</html>
