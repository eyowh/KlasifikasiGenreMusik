{% load static %}
<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary":"#3525cd","on-primary":"#ffffff","primary-container":"#4f46e5","on-primary-container":"#dad7ff","primary-fixed":"#e2dfff","primary-fixed-dim":"#c3c0ff",
            "secondary":"#00687a","on-secondary":"#ffffff","secondary-container":"#57dffe","secondary-fixed":"#acedff","secondary-fixed-dim":"#4cd7f6","on-secondary-container":"#006172",
            "background":"#f9f9ff","on-background":"#111c2d","surface":"#f9f9ff","surface-bright":"#f9f9ff",
            "surface-container-lowest":"#ffffff","surface-container-low":"#f0f3ff","surface-container":"#e7eeff","surface-container-high":"#dee8ff","surface-container-highest":"#d8e3fb",
            "on-surface":"#111c2d","on-surface-variant":"#464555","surface-variant":"#d8e3fb","inverse-surface":"#263143",
            "outline":"#777587","outline-variant":"#c7c4d8","error":"#ba1a1a","on-error":"#ffffff","error-container":"#ffdad6",
          },
          fontFamily: { "sans":["Inter","sans-serif"], "display":["Plus Jakarta Sans","sans-serif"] },
          fontSize: {
            "headline-md":["24px",{lineHeight:"1.3",fontWeight:"600"}],
            "display-lg":["48px",{lineHeight:"1.1",letterSpacing:"-0.02em",fontWeight:"800"}],
            "label-md":["14px",{lineHeight:"1.4",letterSpacing:"0.05em",fontWeight:"600"}],
            "label-sm":["12px",{lineHeight:"1.4",fontWeight:"500"}],
            "body-md":["16px",{lineHeight:"1.5",fontWeight:"400"}],
          },
          spacing: { "xs":"0.5rem","sm":"1rem","md":"1.5rem","lg":"2.5rem","xl":"4rem" },
          borderRadius: { "DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px" },
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-weight:normal; font-style:normal; font-size:24px; line-height:1; letter-spacing:normal; text-transform:none; display:inline-block; white-space:nowrap; direction:ltr; -webkit-font-smoothing:antialiased; }
    .glass-card { background:rgba(255,255,255,0.9); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.4); box-shadow:0px 12px 32px rgba(79,70,229,0.08); }
    .ambient-bg { background:radial-gradient(circle at 50% 0%, #f0f3ff 0%, #f9f9ff 100%); }
    .input-elegant { border:1px solid #c7c4d8; transition:all 0.2s ease; }
    .input-elegant:focus { border-color:#3525cd; box-shadow:0 0 0 2px rgba(53,37,205,0.1); outline:none; }
    .btn-primary { background-color:#3525cd; color:#ffffff; transition:all 0.2s ease; }
    .btn-primary:hover { background-color:#2b1ea8; box-shadow:0 0 15px rgba(87,223,254,0.4); }
  </style>
</head>
<body class="bg-surface font-sans text-on-surface antialiased min-h-screen flex flex-col items-center justify-center ambient-bg py-12 px-sm relative overflow-x-hidden">

  <!-- Decorative blobs -->
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
    <div class="absolute top-[-10%] left-[-5%] w-[40%] h-[40%] bg-primary-fixed-dim/30 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-[-10%] right-[-5%] w-[30%] h-[30%] bg-secondary-container/20 rounded-full blur-[80px]"></div>
  </div>

  <main class="w-full max-w-md relative z-10">
    <!-- Brand -->
    <div class="text-center mb-xl">
      <h1 class="font-display font-bold text-display-lg text-primary">Dungeon Studio</h1>
    </div>

    <!-- Glass Card -->
    <div class="glass-card rounded-xl p-lg">

      <!-- Error Message -->
      {% if error %}
      <div class="mb-md flex items-center gap-2 bg-error-container text-on-error-container p-sm rounded-lg text-body-md">
        <span class="material-symbols-outlined text-[18px]">error</span>
        {{ error }}
      </div>
      {% endif %}

      {% if messages %}
      {% for message in messages %}
      <div class="mb-md flex items-center gap-3 bg-green-50 border border-green-300 text-green-800 px-4 py-3 rounded-xl text-label-md font-label-md shadow-sm animate-pulse-once">
        <span class="material-symbols-outlined flex-shrink-0" style="color:#16a34a; font-size:22px;">check_circle</span>
        <span>{{ message }}</span>
      </div>
      {% endfor %}
      {% endif %}

      <h2 class="font-display font-bold text-headline-md text-on-surface mb-md">Selamat Datang</h2>

      <form method="POST" class="flex flex-col gap-md" id="loginForm">
        {% csrf_token %}

        <!-- Username -->
        <div>
          <label class="text-label-md font-label-md text-on-surface block mb-xs" for="username">Username</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">person</span>
            <input
              class="input-elegant w-full rounded-lg py-3 pl-10 pr-4 text-body-md text-on-surface bg-transparent"
              id="username" name="username" type="text"
              placeholder="Masukkan username"
              value="{{ username }}" required>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="text-label-md font-label-md text-on-surface block mb-xs" for="password">Password</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
            <input
              class="input-elegant w-full rounded-lg py-3 pl-10 pr-4 text-body-md text-on-surface bg-transparent"
              id="password" name="password" type="password"
              placeholder="Masukkan password" required>
          </div>
        </div>

        <button type="submit" id="btnSubmit" class="btn-primary w-full py-3 rounded-lg text-label-md font-label-md mt-sm flex items-center justify-center gap-xs relative overflow-hidden">
          <span id="btnText" class="flex items-center gap-xs">Masuk <span class="material-symbols-outlined text-[18px]">arrow_forward</span></span>
          <div id="btnSpinner" class="hidden absolute inset-0 flex items-center justify-center bg-primary">
            <div class="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          </div>
        </button>
      </form>

      <div class="mt-lg text-center">
        <p class="text-body-md text-on-surface-variant">
          Belum punya akun?
          <a href="{% url 'Klasifikasi:register' %}" class="text-label-md font-label-md text-primary hover:underline">Daftar di sini</a>
        </p>
      </div>
    </div>
  </main>

</body>
<script>
  document.getElementById('loginForm').addEventListener('submit', function() {
    const btn = document.getElementById('btnSubmit');
    const text = document.getElementById('btnText');
    const spinner = document.getElementById('btnSpinner');
    
    btn.disabled = true;
    btn.classList.add('opacity-90', 'cursor-wait');
    text.classList.add('invisible');
    spinner.classList.remove('hidden');
  });
</script>
</html>
