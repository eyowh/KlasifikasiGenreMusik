<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dungeon Studio - Login &amp; Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#263143",
                        "on-tertiary-fixed": "#191c1e",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#e0e3e5",
                        "secondary-fixed-dim": "#4cd7f6",
                        "primary": "#3525cd",
                        "secondary-container": "#57dffe",
                        "primary-container": "#4f46e5",
                        "on-tertiary-fixed-variant": "#444749",
                        "secondary-fixed": "#acedff",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-container-low": "#f0f3ff",
                        "on-primary-container": "#dad7ff",
                        "on-secondary-fixed": "#001f26",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#ecf1ff",
                        "on-secondary-container": "#006172",
                        "primary-fixed": "#e2dfff",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#777587",
                        "on-background": "#111c2d",
                        "tertiary": "#46494b",
                        "on-surface": "#111c2d",
                        "on-primary-fixed": "#0f0069",
                        "secondary": "#00687a",
                        "surface-container": "#e7eeff",
                        "on-secondary-fixed-variant": "#004e5c",
                        "surface-container-highest": "#d8e3fb",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-dim": "#cfdaf2",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#c3c0ff",
                        "inverse-primary": "#c3c0ff",
                        "surface-bright": "#f9f9ff",
                        "surface-variant": "#d8e3fb",
                        "outline-variant": "#c7c4d8",
                        "surface-container-high": "#dee8ff",
                        "surface-tint": "#4d44e3",
                        "tertiary-container": "#5e6163",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "background": "#f9f9ff",
                        "on-surface-variant": "#464555",
                        "surface": "#f9f9ff",
                        "on-tertiary-container": "#dadcde"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "container-max": "1280px",
                        "sm": "1rem",
                        "xl": "4rem",
                        "xs": "0.5rem",
                        "lg": "2.5rem",
                        "md": "1.5rem",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0px 12px 32px rgba(79, 70, 229, 0.08);
        }
        
        .ambient-bg {
            background: radial-gradient(circle at 50% 0%, #f0f3ff 0%, #f9f9ff 100%);
        }

        .input-elegant {
            border: 1px solid #c7c4d8;
            transition: all 0.2s ease;
        }
        
        .input-elegant:focus {
            border-color: #3525cd;
            box-shadow: 0 0 0 2px rgba(53, 37, 205, 0.1);
            outline: none;
        }

        .btn-primary {
            background-color: #3525cd;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        
        .btn-primary:hover {
            background-color: #2b1ea8;
            box-shadow: 0 0 15px rgba(87, 223, 254, 0.4);
        }

        /* Toggle Views */
        .view-hidden { display: none; }
        .view-active { display: block; animation: fadeIn 0.4s ease-out forwards; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center ambient-bg p-sm md:p-lg relative overflow-hidden">
<!-- Decorative ambient shapes behind -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
<div class="absolute top-[-10%] left-[-5%] w-[40%] h-[40%] bg-primary-fixed-dim/30 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[30%] h-[30%] bg-secondary-container/20 rounded-full blur-[80px]"></div>
</div>
<!-- Main Container -->
<main class="w-full max-w-md relative z-10">
<!-- Brand Header -->
<div class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg text-primary flex flex-col items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[48px] bg-gradient-to-br from-primary to-secondary-container bg-clip-text text-transparent" style="font-variation-settings: 'FILL' 1;">
                    graphic_eq
                </span>
                Dungeon Studio
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">AI Music Engine</p>
</div>
<!-- Glassmorphism Card -->
<div class="glass-card rounded-xl p-lg bg-surface-container-lowest">
<!-- Login View -->
<div class="view-active" id="loginView">
<h2 class="font-headline-md text-headline-md text-on-surface mb-md">Welcome Back</h2>
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<div>
<label class="font-label-md text-label-md text-on-surface block mb-xs" for="login-username">Username or Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">person</span>
<input class="input-elegant w-full rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface bg-transparent" id="login-username" placeholder="Enter your username" type="text"/>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-xs">
<label class="font-label-md text-label-md text-on-surface block" for="login-password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="input-elegant w-full rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface bg-transparent" id="login-password" placeholder="Enter your password" type="password"/>
</div>
</div>
<div class="flex items-center gap-xs mt-xs">
<input class="rounded border-outline-variant text-primary focus:ring-primary h-4 w-4 bg-transparent cursor-pointer" id="remember-me" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember-me">Remember Me</label>
</div>
<button class="btn-primary w-full py-3 rounded-lg font-label-md text-label-md mt-sm flex items-center justify-center gap-xs" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Don't have an account? 
                        <button class="font-label-md text-label-md text-primary hover:underline focus:outline-none" onclick="toggleView('register')">Register here</button>
</p>
</div>
</div>
<!-- Registration View -->
<div class="view-hidden" id="registerView">
<h2 class="font-headline-md text-headline-md text-on-surface mb-md">Create Account</h2>
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<div>
<label class="font-label-md text-label-md text-on-surface block mb-xs" for="reg-fullname">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">badge</span>
<input class="input-elegant w-full rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface bg-transparent" id="reg-fullname" placeholder="John Doe" type="text"/>
</div>
</div>
<div>
<label class="font-label-md text-label-md text-on-surface block mb-xs" for="reg-username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">alternate_email</span>
<input class="input-elegant w-full rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface bg-transparent" id="reg-username" placeholder="johndoe123" type="text"/>
</div>
</div>
<div>
<label class="font-label-md text-label-md text-on-surface block mb-xs" for="reg-email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
<input class="input-elegant w-full rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface bg-transparent" id="reg-email" placeholder="john@example.com" type="email"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-sm">
<div>
<label class="font-label-md text-label-md text-on-surface block mb-xs" for="reg-password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="input-elegant w-full rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface bg-transparent" id="reg-password" placeholder="••••••••" type="password"/>
</div>
</div>
<div>
<label class="font-label-md text-label-md text-on-surface block mb-xs" for="reg-confirm-password">Confirm</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">verified</span>
<input class="input-elegant w-full rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface bg-transparent" id="reg-confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<button class="btn-primary w-full py-3 rounded-lg font-label-md text-label-md mt-sm flex items-center justify-center gap-xs" type="submit">
                        Create Account
                        <span class="material-symbols-outlined text-[18px]">person_add</span>
</button>
</form>
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Already have an account? 
                        <button class="font-label-md text-label-md text-primary hover:underline focus:outline-none" onclick="toggleView('login')">Sign in</button>
</p>
</div>
</div>
</div>
</main>
<script>
        function toggleView(view) {
            const loginView = document.getElementById('loginView');
            const registerView = document.getElementById('registerView');
            
            if (view === 'register') {
                loginView.classList.remove('view-active');
                loginView.classList.add('view-hidden');
                registerView.classList.remove('view-hidden');
                // slight delay to allow display:block to apply before animation
                setTimeout(() => {
                    registerView.classList.add('view-active');
                }, 10);
            } else {
                registerView.classList.remove('view-active');
                registerView.classList.add('view-hidden');
                loginView.classList.remove('view-hidden');
                setTimeout(() => {
                    loginView.classList.add('view-active');
                }, 10);
            }
        }
    </script>
</body></html>
